name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Two pushes in quick succession would otherwise leave two runs racing, and
# only the newer commit's result is worth reading. Cancelling the superseded
# one keeps that result and spends the minutes on nothing else.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The interpreter the checkpoint was trained and served under.
          python-version: "3.12"
          cache: pip

      - name: Install torch (CPU build)
        # The index URL is the one requirements.txt documents. PyPI's Linux
        # torch wheel is the CUDA build — gigabytes of driver runtime for a
        # job with no GPU to run it on.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install the Archil SDK
        # Its own file, installed from PyPI: requirements.txt is resolved
        # against the CPU torch index above, which carries no PyPI packages.
        # archil_store.py imports the SDK at the top, so the disk tests cannot
        # even load without this wheel — they never call it.
        # Quoted: `--only-binary=:all:` is a plain scalar YAML parsers read as
        # a mapping unless it is in quotes.
        run: 'python -m pip install --only-binary=:all: -r requirements-archil.txt'

      - name: Report the environment
        # When a test fails here and not locally, the versions are the first
        # thing worth reading, so print them before anything that can fail.
        run: |
          python -c "import sys; print(sys.version)"
          python -c "import torch; print('torch', torch.__version__)"

      # One step per project rather than one command: a failure then names the
      # project it came from without opening the log.
      - name: Training, tokeniser and web server
        run: python -m unittest test_all -v

      # The attention viewer's own guarantees: that capturing weights does not
      # change the logits, that the published matrix is still causal, and that
      # the API answers rather than crashing on a malformed body.
      - name: Attention viewer
        run: python -m unittest test_peek -v

      # The disk module, with the SDK faked: `.env` parsing and precedence, a
      # refusal that names the missing credential before any network call, and
      # the key/region/id wiring. No account and no network are involved.
      - name: Disk store
        run: python -m unittest test_archil_store -v

      - name: WiFi radar
        run: python -m unittest wifi_radar.test_radar -v

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # The sketch is the only part of the project a test cannot exercise: it
      # needs a compiler and a board. The compiler is ordinary software, so it
      # is worth pinning that the firmware at least builds for the chip it
      # claims, in the configuration the README tells people to select.
      - name: Install arduino-cli and the AVR core
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://downloads.arduino.cc/arduino-cli/arduino-cli_latest_Linux_64bit.tar.gz \
            | tar -xz -C "$HOME/.local/bin" arduino-cli
          # $GITHUB_PATH only takes effect from the next step, so the rest of
          # this one needs the binary on its own PATH.
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          arduino-cli version
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Compile the Mega channel node
        # --warnings all reports trouble in the sketch itself; the core's own
        # warnings are noise and do not fail the step.
        run: |
          arduino-cli compile --fqbn arduino:avr:mega --warnings all \
            --build-path "$RUNNER_TEMP/mega-build" \
            wifi_radar/arduino/mega_channel_node

  mediatop:
    # Standard library only and every fixture is a string in the test file, so
    # this job needs no install step and no network. It ran nowhere before: the
    # board's own tests were green locally and unrun on every push.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: The board, its scoring and its digest
        run: python -m unittest mediatop.test_mediatop -v

  provenance-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # Caches the wheel downloads, keyed on the lab's own pin set rather
          # than the root requirements.txt, which it does not share.
          cache: pip
          cache-dependency-path: provenance_lab/requirements.txt

      # The lab pins c2pa-python, Pillow, cryptography and requests, and its
      # tests sign and verify real manifests. It runs in its own job so those
      # pins never have to agree with the root requirements.txt — the README's
      # venv is about keeping the lab off a developer's interpreter, which the
      # job already does on the runner.
      - name: Install the lab's pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r provenance_lab/requirements.txt

      - name: Report the environment
        # A native C2PA library that will not load on the runner is the first
        # thing to check when a test fails here but not locally.
        run: |
          python -c "import sys; print(sys.version)"
          python -c "from importlib.metadata import version; print('c2pa-python', version('c2pa-python')); print('Pillow', version('Pillow')); print('cryptography', version('cryptography')); print('requests', version('requests'))"

      # The suite signs with a generated test CA and serves the platform arm
      # from a loopback HTTP server, so nothing here reaches the internet.
      - name: C2PA provenance lab
        working-directory: provenance_lab
        run: python -m unittest -v

  doctor:
    # The radar's one hardware-facing command, pinned without hardware: a pty
    # stands in for the board, and the doctor's contract — exit 0 and say
    # "printing" when `S,` lines arrive — is enforced against the real port
    # code rather than a fake object. It has already caught one crash that the
    # unit tests could not: a driver that refuses the DTR ioctl.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # pyserial is the only dependency the doctor has, and the only one this
      # job needs; the torch install above would be minutes of nothing.
      - name: Install pyserial
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyserial

      - name: The doctor against a simulated board
        # Fails on a verdict other than `printing`, a non-zero exit, or no
        # counted samples — and prints the JSON it judged, so a red log says
        # what the doctor actually saw.
        run: python -m wifi_radar.fakeboard --verbose
