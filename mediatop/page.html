<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mediatop — the point of the news</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0b0d;
    --panel: #121417;
    --panel-2: #171a1e;
    --line: #23262b;
    --ink: #e9ebef;
    --muted: #9aa1ab;
    --dim: #6c737d;
    --accent: #7aa2f7;
    --tech: #7aa2f7;
    --world: #e3a765;
    --canada: #f07178;
    --science: #7fd1a0;
    --radius: 10px;
    --gap: 14px;
  }
  /* Two palettes, and `data-theme` is only ever `dark` or `light`: the choice
     "auto" is resolved against the system before the first paint (see the script
     at the end of the head), so a system change can never leave the page on a
     stale palette and the stylesheet needs one block per theme, not three. */
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f7f7f5;
    --panel: #ffffff;
    --panel-2: #f2f2ef;
    --line: #e2e1dc;
    --ink: #15171a;
    --muted: #5c626a;
    --dim: #868c94;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  /* ---- header ------------------------------------------------------- */
  .bar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    padding: 12px clamp(12px, 2.2vw, 28px);
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .brand {
    font-weight: 700;
    font-size: 17px;
    letter-spacing: -.02em;
  }
  .brand span { color: var(--accent); }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tabs button {
    font: inherit;
    font-size: 13px;
    color: var(--muted);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 5px 11px;
    cursor: pointer;
    transition: background .14s, color .14s, border-color .14s;
  }
  .tabs button:hover { color: var(--ink); background: var(--panel-2); }
  .tabs button[aria-pressed="true"] {
    color: var(--ink);
    background: var(--panel-2);
    border-color: var(--line);
  }
  .tabs button:focus-visible,
  .stamp button:focus-visible,
  .theme button:focus-visible,
  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  /* ---- background switcher ------------------------------------------ */
  .theme {
    display: flex;
    gap: 1px;
    padding: 2px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .theme button {
    display: flex;
    align-items: center;
    gap: 5px;
    font: inherit;
    font-size: 12px;
    color: var(--muted);
    background: transparent;
    border: 0;
    border-radius: 6px;
    padding: 3px 8px 3px 6px;
    cursor: pointer;
    transition: background .14s, color .14s;
  }
  .theme button:hover { color: var(--ink); background: var(--panel-2); }
  .theme button[aria-pressed="true"] {
    color: var(--ink);
    background: var(--panel-2);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .theme .swatch {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--panel-2);
  }
  .theme [data-choice="auto"] .swatch {
    background: linear-gradient(105deg, #0a0b0d 0 50%, #f7f7f5 50% 100%);
  }
  .theme [data-choice="light"] .swatch { background: #f7f7f5; }
  .theme [data-choice="dark"] .swatch { background: #0a0b0d; }
  .stamp {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .stamp button {
    font: inherit;
    font-size: 12.5px;
    color: var(--ink);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 5px 10px;
    cursor: pointer;
  }
  .stamp button:hover { border-color: var(--muted); }
  .stamp button[disabled] { opacity: .5; cursor: progress; }

  /* ---- failures ----------------------------------------------------- */
  .failures {
    margin: 0;
    padding: 8px clamp(12px, 2.2vw, 28px);
    font-size: 12.5px;
    color: var(--muted);
    background: color-mix(in srgb, var(--world) 10%, transparent);
    border-bottom: 1px solid var(--line);
  }
  .failures b { color: var(--ink); font-weight: 600; }

  /* ---- board -------------------------------------------------------- */
  main { padding: 0 clamp(12px, 2.2vw, 28px) 40px; }
  .genre { padding-top: 20px; }
  .genre h2 {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 0 0 10px;
    font-size: 11.5px;
    font-weight: 650;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .genre h2::before {
    content: "";
    width: 18px;
    height: 2px;
    border-radius: 2px;
    background: var(--accent);
    align-self: center;
  }
  .genre[data-genre="tech"] { --accent: var(--tech); }
  .genre[data-genre="world"] { --accent: var(--world); }
  .genre[data-genre="canada"] { --accent: var(--canada); }
  .genre[data-genre="science"] { --accent: var(--science); }
  .genre h2 small {
    font: inherit;
    letter-spacing: 0;
    text-transform: none;
    font-weight: 400;
    color: var(--dim);
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: var(--gap);
  }

  .card {
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 14px 15px 13px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    transition: border-color .16s, transform .16s, background .16s;
  }
  .card:hover {
    border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
    background: var(--panel-2);
  }
  .meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    color: var(--dim);
    letter-spacing: .01em;
  }
  .meta .source { color: var(--muted); font-weight: 600; }
  .meta .dot { opacity: .6; }
  .headline {
    font-size: 15.5px;
    line-height: 1.3;
    font-weight: 650;
    letter-spacing: -.011em;
    text-decoration: none;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .headline:hover { text-decoration: underline; text-underline-offset: 2px; }
  .point {
    margin: 0;
    padding-left: 10px;
    border-left: 2px solid var(--accent);
    font-size: 14px;
    line-height: 1.42;
    color: var(--ink);
  }
  .facts {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .facts li {
    position: relative;
    padding-left: 12px;
    font-size: 12.9px;
    line-height: 1.4;
    color: var(--muted);
  }
  .facts li::before {
    content: "";
    position: absolute;
    left: 0;
    top: .62em;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--accent) 65%, var(--muted));
  }
  .foot {
    margin-top: auto;
    padding-top: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    color: var(--dim);
  }
  .foot .flag {
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 1px 5px;
    font-size: 10.5px;
    letter-spacing: .02em;
    color: var(--muted);
    cursor: help;
  }
  .foot a {
    margin-left: auto;
    color: var(--muted);
    text-decoration: none;
    white-space: nowrap;
  }
  .foot a:hover { color: var(--ink); }

  /* ---- states ------------------------------------------------------- */
  .skeleton .card { min-height: 196px; }
  .sk {
    background: linear-gradient(90deg, var(--panel-2) 25%,
                color-mix(in srgb, var(--panel-2) 55%, var(--line)) 37%,
                var(--panel-2) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease-in-out infinite;
    border-radius: 5px;
  }
  .sk.line { height: 11px; }
  .sk.title { height: 17px; margin-bottom: 4px; }
  .sk.point { height: 34px; }
  @keyframes shimmer {
    from { background-position: 100% 0; }
    to { background-position: 0 0; }
  }
  .empty, .error {
    padding: 48px 4px;
    color: var(--muted);
    font-size: 14px;
  }
  .error button {
    font: inherit;
    margin-left: 8px;
    color: var(--ink);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 4px 10px;
    cursor: pointer;
  }
  footer.notes {
    padding: 18px clamp(12px, 2.2vw, 28px) 34px;
    border-top: 1px solid var(--line);
    color: var(--dim);
    font-size: 12px;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  @media (max-width: 560px) {
    .stamp { width: 100%; margin-left: 0; }
    .cards { grid-template-columns: 1fr; }
  }
</style>
<script>
  // The background is painted from `data-theme`, so it has to be right before
  // the first frame rather than after the board loads. "auto" means the system
  // setting; it is resolved here so the stylesheet only needs dark and light.
  (() => {
    let choice = "auto";
    try { choice = localStorage.getItem("mediatop.theme") || "auto"; } catch (e) {}
    const light = window.matchMedia("(prefers-color-scheme: light)").matches;
    document.documentElement.dataset.theme =
      choice === "auto" ? (light ? "light" : "dark") : choice;
  })();
</script>
</head>
<body>
<header class="bar">
  <div class="brand">mediatop<span>.</span></div>
  <nav class="tabs" id="tabs" aria-label="Genres"></nav>
  <div class="theme" id="theme" role="group" aria-label="Background">
    <button type="button" data-choice="auto" title="Follow the system"
            aria-pressed="true"><span class="swatch"></span>Auto</button>
    <button type="button" data-choice="light" title="Light background"
            aria-pressed="false"><span class="swatch"></span>Day</button>
    <button type="button" data-choice="dark" title="Dark background"
            aria-pressed="false"><span class="swatch"></span>Night</button>
  </div>
  <div class="stamp">
    <span id="status" role="status" aria-live="polite">Loading…</span>
    <button id="refresh" type="button" title="Refresh (r)">Refresh</button>
  </div>
</header>
<p class="failures" id="failures" hidden></p>
<main id="board" aria-busy="true"></main>
<footer class="notes">
  <span>Every line on a card is a sentence from the article, selected — never written.</span>
  <span id="counts"></span>
</footer>

<script>
(() => {
  "use strict";

  const GENRES = [
    ["tech", "Tech"],
    ["world", "Geopolitics"],
    ["canada", "Canadian government"],
    ["science", "Science"],
  ];
  const board = document.getElementById("board");
  const tabs = document.getElementById("tabs");
  const status = document.getElementById("status");
  const refresh = document.getElementById("refresh");
  const failures = document.getElementById("failures");
  const counts = document.getElementById("counts");
  const themeGroup = document.getElementById("theme");
  const systemLight = window.matchMedia("(prefers-color-scheme: light)");

  let filter = localStorage.getItem("mediatop.genre") || "all";
  let data = null;
  let inflight = false;
  let lastFetch = 0;

  /* ---- background -------------------------------------------------- */
  // The choice is remembered as itself — "auto" stays "auto" rather than being
  // frozen into whatever the system said that day — and it is only written when
  // the reader picks something. A page load must never overwrite it: that is
  // how a stored choice was once replaced by "auto" before the board had even
  // started loading.
  function storedTheme() {
    try {
      const saved = localStorage.getItem("mediatop.theme");
      return saved === "light" || saved === "dark" ? saved : "auto";
    } catch (error) {
      return "auto";
    }
  }

  function applyTheme(choice, remember) {
    const light = choice === "auto" ? systemLight.matches : choice === "light";
    document.documentElement.dataset.theme = light ? "light" : "dark";
    for (const button of themeGroup.children) {
      button.setAttribute("aria-pressed", String(button.dataset.choice === choice));
    }
    if (remember) {
      try { localStorage.setItem("mediatop.theme", choice); } catch (error) {}
    }
  }

  for (const button of themeGroup.children) {
    button.addEventListener("click", () => applyTheme(button.dataset.choice, true));
  }
  // A system change only matters while the page is following it. Asking storage
  // rather than a variable keeps this correct even if the event arrives before
  // the first `applyTheme` has run.
  systemLight.addEventListener("change", () => {
    if (storedTheme() === "auto") applyTheme("auto");
  });

  /* ---- helpers ----------------------------------------------------- */
  const el = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  function ago(iso) {
    if (!iso) return "";
    const then = Date.parse(iso);
    if (Number.isNaN(then)) return "";
    const minutes = Math.round((Date.now() - then) / 60000);
    if (minutes < 1) return "now";
    if (minutes < 60) return minutes + "m";
    const hours = Math.round(minutes / 60);
    if (hours < 24) return hours + "h";
    return Math.round(hours / 24) + "d";
  }

  function clock(iso) {
    if (!iso) return "";
    const when = new Date(iso);
    return when.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function renderTabs() {
    tabs.replaceChildren();
    const options = [["all", "Everything"], ...GENRES];
    for (const [key, label] of options) {
      const button = el("button", null, label);
      button.type = "button";
      button.dataset.genre = key;
      button.setAttribute("aria-pressed", String(filter === key));
      button.addEventListener("click", () => setFilter(key));
      tabs.append(button);
    }
  }

  function setFilter(key) {
    filter = key;
    localStorage.setItem("mediatop.genre", key);
    for (const button of tabs.children) {
      button.setAttribute("aria-pressed", String(button.dataset.genre === key));
    }
    if (data) render();
  }

  /* ---- cards ------------------------------------------------------- */
  function card(item) {
    const article = el("article", "card");
    article.dataset.genre = item.genre;

    const meta = el("div", "meta");
    meta.append(el("span", "source", item.source));
    const when = ago(item.published);
    if (when) {
      meta.append(el("span", "dot", "·"), el("span", null, when));
    }
    article.append(meta);

    const headline = el("a", "headline", item.title);
    headline.href = item.url;
    headline.target = "_blank";
    headline.rel = "noopener noreferrer";
    article.append(headline);

    article.append(el("p", "point", item.point));

    if (item.facts && item.facts.length) {
      const list = el("ul", "facts");
      for (const fact of item.facts) list.append(el("li", null, fact));
      article.append(list);
    }

    const foot = el("div", "foot");
    if (item.method !== "article") {
      const flag = el("span", "flag", "summary only");
      flag.title = item.note
        ? "The article page could not be read (" + item.note + "), so this card uses the feed's own summary."
        : "The article page gave up no readable text, so this card uses the feed's own summary.";
      foot.append(flag);
    } else if (item.note) {
      const flag = el("span", "flag", "partial");
      flag.title = item.note;
      foot.append(flag);
    } else {
      foot.append(el("span", "flag", (item.facts.length || 0) + " facts"));
    }
    const link = el("a", null, "Full story ↗");
    link.href = item.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    foot.append(link);
    article.append(foot);
    return article;
  }

  function skeleton() {
    board.setAttribute("aria-busy", "true");
    board.classList.add("skeleton");
    board.replaceChildren();
    for (const [key, label] of GENRES) {
      const section = el("section", "genre");
      section.dataset.genre = key;
      const heading = el("h2", null, label);
      section.append(heading);
      const grid = el("div", "cards");
      for (let i = 0; i < 4; i++) {
        const holder = el("article", "card");
        holder.append(el("div", "sk line"));
        holder.append(el("div", "sk title"));
        holder.append(el("div", "sk point"));
        holder.append(el("div", "sk line"));
        grid.append(holder);
      }
      section.append(grid);
      board.append(section);
      if (filter !== "all" && filter !== key) section.hidden = true;
    }
  }

  /* ---- render ------------------------------------------------------ */
  function render() {
    board.classList.remove("skeleton");
    board.removeAttribute("aria-busy");
    board.replaceChildren();

    const shown = data.genres.filter((g) => filter === "all" || g.key === filter);
    if (!shown.length || shown.every((g) => !g.cards.length)) {
      const empty = el("p", "empty", "No readable stories in this genre right now.");
      board.append(empty);
      return;
    }

    for (const genre of shown) {
      if (!genre.cards.length) continue;
      const section = el("section", "genre");
      section.dataset.genre = genre.key;
      const heading = el("h2", null, genre.label);
      heading.append(el("small", null, genre.cards.length + " stories"));
      section.append(heading);
      const grid = el("div", "cards");
      for (const item of genre.cards) grid.append(card(item));
      section.append(grid);
      board.append(section);
    }

    failures.hidden = !data.failures.length;
    if (data.failures.length) {
      failures.replaceChildren(
        el("b", null, data.failures.length +
          (data.failures.length === 1 ? " feed failed" : " feeds failed")),
        document.createTextNode(" · " + data.failures
          .map((f) => f.source + " (" + f.error + ")").join(" · "))
      );
    }

    counts.textContent = data.counts.stories + " stories from " +
      data.counts.sources + " sources · built " + clock(data.generated);
    status.textContent = "Updated " + clock(data.generated);
  }

  /* ---- loading ----------------------------------------------------- */
  async function load(force = false) {
    if (inflight) return;
    inflight = true;
    refresh.disabled = true;
    status.textContent = "Reading feeds…";
    if (!data) skeleton();
    try {
      const response = await fetch("/api/top" + (force ? "?refresh=1" : ""),
                                   { headers: { Accept: "application/json" } });
      if (!response.ok) throw new Error("HTTP " + response.status);
      data = await response.json();
      lastFetch = Date.now();
      render();
    } catch (error) {
      board.classList.remove("skeleton");
      board.removeAttribute("aria-busy");
      board.replaceChildren();
      const box = el("div", "error", "Could not build the board: " + error.message);
      const retry = el("button", null, "Try again");
      retry.type = "button";
      retry.addEventListener("click", () => load(true));
      box.append(retry);
      board.append(box);
      status.textContent = "Nothing loaded";
    } finally {
      inflight = false;
      refresh.disabled = false;
    }
  }

  /* ---- events ------------------------------------------------------ */
  refresh.addEventListener("click", () => load(true));

  document.addEventListener("keydown", (event) => {
    const target = event.target;
    if (target instanceof HTMLElement &&
        (target.tagName === "INPUT" || target.tagName === "TEXTAREA")) return;
    if (event.key === "r") load(true);
    else if (event.key === "0") setFilter("all");
    else if (/^[1-4]$/.test(event.key)) setFilter(GENRES[Number(event.key) - 1][0]);
  });

  // A board left open goes stale quietly; rebuild it when it is actually being
  // looked at, and only after the TTL the server is already using.
  setInterval(() => {
    if (document.visibilityState === "visible" && Date.now() - lastFetch > 600000) {
      load(true);
    }
  }, 60000);

  applyTheme(storedTheme());
  renderTabs();
  skeleton();
  load(false);
})();
</script>
</body>
</html>
